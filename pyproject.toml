[project]
name = "hubd"
version = "0.2.0.dev0"
description = "sprint-hub v2 daemon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "python-frontmatter>=1.3.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[project.scripts]
hubd = "hubd.__main__:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

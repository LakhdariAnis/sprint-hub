[project]
name = "hubd"
version = "0.2.0.dev0"
description = "sprint-hub v2 daemon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[project.scripts]
hubd = "hubd.__main__:main"
